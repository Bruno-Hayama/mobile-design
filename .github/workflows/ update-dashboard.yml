name: Atualizar Dashboard Mobile Design

on:
  schedule:
    # Toda segunda-feira às 08:00 Brasília (11:00 UTC)
    - cron: '0 11 * * 1'
  # Permite rodar manualmente pelo GitHub
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rodar script de atualização
        run: python update_dashboard.py

      - name: Commit e push do dashboard atualizado
        run: |
          git config --global user.name "Dashboard Bot"
          git config --global user.email "bot@mobile-design.com"
          git add index.html
          git diff --staged --quiet || git commit -m "🤖 Dashboard atualizado automaticamente — $(TZ='America/Sao_Paulo' date +'%d/%m/%Y %H:%M')"
          git push
